<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700;900&display=swap');

  :root {
    --bg: #050a08;
    --neon-green: #00ff64;
    --neon-cyan: #00e5ff;
    --gold: #C9A84C;
    --gold-bright: #f0c060;
    --red: #ff3c5a;
    --purple: #a855f7;
    --white: #e8f0eb;
    --muted: #4a6655;
    --panel-bg: rgba(5,15,10,0.97);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,255,100,0.015) 3px, rgba(0,255,100,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,255,100,0.02) 39px, rgba(0,255,100,0.02) 40px);
    pointer-events: none;
    z-index: 1;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 12px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,255,100,0.12);
    background: linear-gradient(to bottom, rgba(5,10,8,0.97), transparent);
    gap: 12px;
  }

  .header-left { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }

  .eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--neon-green);
    text-transform: uppercase;
    opacity: 0.8;
  }

  .header-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .header-title span { color: var(--gold); }

  /* ── SEARCH ── */
  .search-wrap { flex: 1; max-width: 260px; position: relative; }

  .search-wrap input {
    width: 100%;
    background: rgba(0,255,100,0.05);
    border: 1px solid rgba(0,255,100,0.2);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 6px 10px 6px 28px;
    outline: none;
    letter-spacing: 1px;
  }

  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: rgba(0,255,100,0.5); }

  .search-icon {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 11px;
    pointer-events: none;
  }

  .search-clear {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: none;
    background: none;
    border: none;
    line-height: 1;
  }

  /* ── WEEK SELECTOR ── */
  .week-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .week-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .week-tabs { display: flex; gap: 3px; }

  .week-tab {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 3px 7px;
    border: 1px solid rgba(0,255,100,0.2);
    border-radius: 4px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .week-tab.active {
    background: rgba(0,255,100,0.1);
    border-color: rgba(0,255,100,0.5);
    color: var(--neon-green);
  }

  .week-tab:hover:not(.active) { border-color: rgba(0,255,100,0.35); color: rgba(232,240,235,0.6); }

  .header-right {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--neon-green);
    text-align: right;
    line-height: 1.6;
    opacity: 0.7;
    flex-shrink: 0;
  }

  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── LEGEND ── */
  .legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 10;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .legend-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-align: right;
  }

  #chart { position: fixed; inset: 0; z-index: 3; }

  /* ── DETAIL PANEL ── */
  #panel {
    position: fixed;
    right: -500px;
    top: 58px;
    bottom: 16px;
    width: 420px;
    max-width: calc(100vw - 32px);
    background: var(--panel-bg);
    border: 1px solid rgba(0,255,100,0.2);
    border-right: none;
    z-index: 20;
    overflow-y: auto;
    transition: right 0.4s cubic-bezier(0.22,1,0.36,1);
    -webkit-overflow-scrolling: touch;
  }

  #panel.open { right: 0; }

  .panel-inner { padding: 20px 20px 28px; }

  .panel-close {
    position: absolute;
    top: 10px; right: 14px;
    background: none;
    border: 1px solid rgba(0,255,100,0.3);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    cursor: pointer;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .panel-close:hover { background: rgba(0,255,100,0.1); }

  .panel-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .trend-arrow { font-size: 13px; font-weight: 900; line-height: 1; }
  .trend-delta { font-size: 9px; opacity: 0.8; }

  .panel-title { font-size: 20px; font-weight: 900; line-height: 1.2; margin-bottom: 5px; letter-spacing: -0.5px; }

  .panel-subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .panel-divider {
    height: 1px;
    background: linear-gradient(to right, rgba(0,255,100,0.3), transparent);
    margin-bottom: 16px;
  }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }

  .stat-box {
    background: rgba(0,255,100,0.04);
    border: 1px solid rgba(0,255,100,0.1);
    border-radius: 7px;
    padding: 10px 12px;
  }

  .stat-box .num { font-size: 18px; font-weight: 900; line-height: 1; margin-bottom: 3px; }

  .stat-box .label {
    font-size: 9px;
    color: var(--muted);
    line-height: 1.4;
    font-family: 'Share Tech Mono', monospace;
  }

  .bullets-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .bullet-item { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }

  .bullet-arrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .bullet-text { font-size: 12px; line-height: 1.55; color: rgba(232,240,235,0.85); }

  .signal-box { margin-top: 16px; border: 1px solid; border-radius: 7px; padding: 12px 14px; }

  .signal-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .signal-text { font-size: 11px; line-height: 1.6; color: rgba(232,240,235,0.8); }

  /* ── SHARE BUTTON ── */
  .share-btn {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid rgba(0,255,100,0.25);
    border-radius: 6px;
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .share-btn:hover { background: rgba(0,255,100,0.08); border-color: rgba(0,255,100,0.5); }
  .share-btn.copied { color: var(--gold); border-color: rgba(201,168,76,0.5); }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,255,100,0.12);
    border: 1px solid rgba(0,255,100,0.3);
    color: var(--neon-green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 8px 18px;
    border-radius: 6px;
    z-index: 50;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  #panel::-webkit-scrollbar { width: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb { background: rgba(0,255,100,0.2); border-radius: 2px; }

  /* ── DIM for search ── */
  .bubble-group.search-dim { opacity: 0.12 !important; }
  .bubble-group.search-match { opacity: 1 !important; }
</style>
</head>

        stats: [ { num: '7–8x', label: 'AI-rendementen die Jordi Visser als voorbij beschouwt' }, { num: '$514B', label: 'Google-contractverplichtingen die pas renderen als datacenters gebouwd zijn' }, { num: '2H 2026', label: 'Periode waarin Visser crypto relatief sterker ziet worden' }, { num: '0 FCF', label: 'Signaal dat zelfs Big Tech vrijekasstroom kan opofferen aan AI-capex' } ],
        bullets: [ 'Open-source AI drukt closed-source marges en maakt intelligentie zelf sneller commodity', 'Hardware, geheugen en energie blijven de echte bottlenecks van de AI-race', 'Visser ziet daardoor een nieuwe schaarste-portefeuille ontstaan: Bitcoin, chips, energie en andere harde assets', 'Als regelgeving tegelijk duidelijker wordt, kan die rotatie sneller richting crypto lopen dan de markt nu prijst' ],
        signal: 'De grote verschuiving is niet "AI uit, crypto in", maar "overvloedige intelligentie uit, echte schaarste in". Dat is gunstig voor Bitcoin en settlement-infrastructuur.', signalColor: '#00e5ff' },
    ]
  },
];

// ── STATE ──────────────────────────────────────────────────────────
let activeWeekIdx = HISTORY.length - 1;
let activeId = null;
let searchQuery = '';

function getTrends() { return HISTORY[activeWeekIdx].trends; }

// ── WEEK TABS ─────────────────────────────────────────────────────
function buildWeekTabs() {
  const container = document.getElementById('week-tabs');
  container.innerHTML = '';
  HISTORY.forEach((h, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (i === activeWeekIdx ? ' active' : '');
    btn.textContent = h.date;
    btn.title = h.week;
    btn.onclick = () => {
      activeWeekIdx = i;
      closePanel();
      buildWeekTabs();
      rebuildChart();
    };
    container.appendChild(btn);
  });
}

// ── CHART (D3 force-directed bubbles) ────────────────────────────
const svg = d3.select('#chart');
const radiusScale = d3.scaleLinear().domain([50, 100]).range([40, 118]);
let simulation = null;

function rebuildChart() {
  svg.selectAll('*').remove();
  const width = window.innerWidth;
  const height = window.innerHeight;
  svg.attr('width', width).attr('height', height);

  const defs = svg.append('defs');
  const nodes = getTrends().map(d => Object.assign({}, d, { r: radiusScale(d.size) }));

  nodes.forEach(d => {
    const grad = defs.append('radialGradient').attr('id', 'grad-' + d.id).attr('cx', '35%').attr('cy', '35%');
    grad.append('stop').attr('offset', '0%').attr('stop-color', d.glow).attr('stop-opacity', 0.95);
    grad.append('stop').attr('offset', '100%').attr('stop-color', d.color).attr('stop-opacity', 0.55);
  });

  const groups = svg.selectAll('.bubble-group')
    .data(nodes, d => d.id)
    .enter()
    .append('g')
    .attr('class', 'bubble-group')
    .style('cursor', 'pointer')
    .on('click', (event, d) => openPanel(d));

  groups.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d => 'url(#grad-' + d.id + ')')
    .attr('stroke', d => d.color)
    .attr('stroke-width', 1.5)
    .attr('stroke-opacity', 0.6);

  groups.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '-0.3em')
    .attr('fill', '#050a08')
    .style('font-family', 'Inter, sans-serif')
    .style('font-weight', 900)
    .style('font-size', d => Math.max(11, d.r / 4.2) + 'px')
    .style('pointer-events', 'none')
    .text(d => d.label);

  groups.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '1em')
    .attr('fill', '#050a08')
    .style('font-family', "'Share Tech Mono', monospace")
    .style('font-size', d => Math.max(8, d.r / 8) + 'px')
    .style('opacity', 0.75)
    .style('pointer-events', 'none')
    .text(d => d.sublabel);

  simulation = d3.forceSimulation(nodes)
    .force('center', d3.forceCenter(width / 2, height / 2 + 10))
    .force('charge', d3.forceManyBody().strength(4))
    .force('collide', d3.forceCollide().radius(d => d.r + 6).iterations(3))
    .on('tick', () => {
      groups.attr('transform', d => `translate(${d.x},${d.y})`);
    });

  groups.call(d3.drag()
    .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  applySearchFilter();
}

// ── DETAIL PANEL ──────────────────────────────────────────────────
function openPanel(d) {
  activeId = d.id;
  const panel = document.getElementById('panel');
  const content = document.getElementById('panel-content');

  let arrowHtml = '';
  if (d.prevSize !== null && d.prevSize !== undefined) {
    const delta = d.size - d.prevSize;
    const arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '●');
    const arrowColor = delta > 0 ? '#00ff64' : (delta < 0 ? '#ff3c5a' : 'var(--muted)');
    arrowHtml = `<span class="trend-arrow" style="color:${arrowColor}">${arrow}</span><span class="trend-delta">${delta > 0 ? '+' : ''}${delta}</span>`;
  }

  content.innerHTML = `
    <div class="panel-tag" style="color:${d.tagColor}">${d.tag} ${arrowHtml}</div>
    <div class="panel-title">${d.title}</div>
    <div class="panel-subtitle">${d.subtitle}</div>
    <div class="panel-divider"></div>
    <div class="stat-row">
      ${d.stats.map(s => `<div class="stat-box"><div class="num" style="color:${d.color}">${s.num}</div><div class="label">${s.label}</div></div>`).join('')}
    </div>
    <div class="bullets-label">Kernpunten</div>
    ${d.bullets.map(b => `<div class="bullet-item"><span class="bullet-arrow" style="color:${d.color}">→</span><span class="bullet-text">${b}</span></div>`).join('')}
    <div class="signal-box" style="border-color:${d.signalColor}66">
      <div class="signal-label" style="color:${d.signalColor}">Signaal voor Denis</div>
      <div class="signal-text">${d.signal}</div>
    </div>
    <button class="share-btn" id="share-btn" onclick="shareTrend('${d.id}')">⇱ Kopieer signaal</button>
  `;
  panel.classList.add('open');
}

function closePanel() {
  activeId = null;
  document.getElementById('panel').classList.remove('open');
}

function shareTrend(id) {
  const d = getTrends().find(t => t.id === id);
  if (!d) return;
  const text = `${d.title}\n${d.subtitle}\n\nSignaal: ${d.signal}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  const btn = document.getElementById('share-btn');
  if (btn) { btn.classList.add('copied'); btn.textContent = '✓ Gekopieerd'; setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '⇱ Kopieer signaal'; }, 1800); }
  showToast('SIGNAAL GEKOPIEERD');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

// ── SEARCH ────────────────────────────────────────────────────────
function applySearchFilter() {
  const q = searchQuery.trim().toLowerCase();
  d3.selectAll('.bubble-group').each(function(d) {
    const el = d3.select(this);
    el.classed('search-dim', false).classed('search-match', false);
    if (!q) return;
    const haystack = (d.label + ' ' + d.sublabel + ' ' + d.title + ' ' + d.subtitle + ' ' + d.bullets.join(' ')).toLowerCase();
    if (haystack.includes(q)) { el.classed('search-match', true); }
    else { el.classed('search-dim', true); }
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  applySearchFilter();
});

function clearSearch() {
  searchQuery = '';
  document.getElementById('search').value = '';
  document.getElementById('search-clear').style.display = 'none';
  applySearchFilter();
}

window.addEventListener('resize', () => rebuildChart());

// ── INIT ──────────────────────────────────────────────────────────
buildWeekTabs();
rebuildChart();
</script>
</body>
</html>
