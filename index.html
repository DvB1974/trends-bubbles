    --red: #ff3c5a;
    --purple: #a855f7;
    --white: #e8f0eb;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:

      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,255,100,0.02) 39px, rgba(0,255,100,0.02) 40px);
    pointer-events: none;
    z-index: 1;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 12px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(0,255,100,0.12);
    background: linear-gradient(to bottom, rgba(5,10,8,0.97), transparent);
    gap: 12px;
  }

  .header-left { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }

  .eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--neon-green);
    text-transform: uppercase;
    opacity: 0.8;
  }

  .header-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .header-title span { color: var(--gold); }

  /* ── SEARCH ── */
  .search-wrap {
    flex: 1;
    max-width: 260px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: rgba(0,255,100,0.05);
    border: 1px solid rgba(0,255,100,0.2);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 6px 10px 6px 28px;
    outline: none;
    letter-spacing: 1px;
  }

  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: rgba(0,255,100,0.5); }

  .search-icon {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 11px;
    pointer-events: none;
  }

  .search-clear {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: none;
    background: none;
    border: none;
    line-height: 1;
  }

  /* ── WEEK SELECTOR ── */
  .week-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .week-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .week-tabs {
    display: flex;
    gap: 3px;
  }

  .week-tab {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    padding: 3px 7px;
    border: 1px solid rgba(0,255,100,0.2);
    border-radius: 4px;
    background: none;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .week-tab.active {
    background: rgba(0,255,100,0.1);
    border-color: rgba(0,255,100,0.5);
    color: var(--neon-green);
  }

  .week-tab:hover:not(.active) { border-color: rgba(0,255,100,0.35); color: rgba(232,240,235,0.6); }

  .header-right {
    font-family: 'Share Tech Mono', monospace;

    color: var(--neon-green);
    text-align: right;
    line-height: 1.6;
    opacity: 0.7;
    flex-shrink: 0;

  .legend {

    left: 20px;
    z-index: 10;

    font-size: 9px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 4px;

    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  .hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-align: right;

  #chart {
    position: fixed;
    inset: 0;
    z-index: 3;

  #panel {

    right: -500px;
    top: 58px;
    bottom: 16px;

    z-index: 20;

    position: absolute;
    top: 10px; right: 14px;

let searchQuery = '';

function getTrends() { return HISTORY[activeWeekIdx].trends; }

// ── WEEK TABS ──────────────────────────────────────────────────────────────────
function buildWeekTabs() {
  const container = document.getElementById('week-tabs');
  container.innerHTML = '';
  HISTORY.forEach((h, i) => {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (i === activeWeekIdx ? ' active' : '');
    btn.textContent = h.date;
    btn.title = h.week;
    btn.onclick = () => {
      activeWeekIdx = i;
      closePanel();
      buildWeekTabs();
      rebuildChart();
    };
    container.appendChild(btn);
  });
}

// ── PANEL ──────────────────────────────────────────────────────────────────────
function closePanel() {
  document.getElementById('panel').classList.remove('open');
  activeId = null;
  d3.selectAll('.bubble-circle')
    .transition().duration(300)
    .attr('opacity', 1)
    .attr('stroke-width', 1.5);
}

function getArrow(trend) {
  if (trend.prevSize === null) return { symbol: '—', color: '#4a6655', delta: 'nieuw' };
  const diff = trend.size - trend.prevSize;
  if (diff > 5) return { symbol: '▲', color: '#00ff64', delta: `+${diff}` };
  if (diff < -5) return { symbol: '▼', color: '#ff3c5a', delta: `${diff}` };
  return { symbol: '◆', color: '#C9A84C', delta: '=' };
}

function openPanel(trend) {
  activeId = trend.id;
  const el = document.getElementById('panel-content');
  const arrow = getArrow(trend);

  const statsHtml = trend.stats.map(s => `
    <div class="stat-box">
      <div class="num" style="color:${trend.color}">${s.num}</div>
      <div class="label">${s.label}</div>
    </div>
  `).join('');

  const bulletsHtml = trend.bullets.map(b => `
    <div class="bullet-item">
      <div class="bullet-arrow" style="color:${trend.color}">→</div>
      <div class="bullet-text">${b}</div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="panel-tag" style="color:${trend.color}">
      ${trend.tag}
      <span class="trend-arrow" style="color:${arrow.color}">${arrow.symbol}</span>
      <span class="trend-delta" style="color:${arrow.color}">${arrow.delta}</span>
    </div>
    <div class="panel-title">${trend.title}</div>
    <div class="panel-subtitle">${trend.subtitle}</div>
    <div class="panel-divider"></div>
    <div class="stat-row">${statsHtml}</div>
    <div class="bullets-label">KEY SIGNALEN</div>
    ${bulletsHtml}
    <div class="signal-box" style="border-color:${trend.color}33; background:${trend.color}08">
      <div class="signal-label" style="color:${trend.color}">SYNTHESE SIGNAAL</div>
      <div class="signal-text">${trend.signal}</div>
    </div>
    <button class="share-btn" onclick="shareSignal(event, '${trend.id}')">
      ⬡ DEEL DIT SIGNAAL
    </button>
  `;

  document.getElementById('panel').classList.add('open');

  d3.selectAll('.bubble-circle')
    .transition().duration(300)
    .attr('opacity', d => d.id === trend.id ? 1 : 0.35)
    .attr('stroke-width', d => d.id === trend.id ? 3 : 1);
}

function shareSignal(e, id) {
  const trend = getTrends().find(t => t.id === id);
  if (!trend) return;
  const week = HISTORY[activeWeekIdx];
  const arrow = getArrow(trend);
  const topBullets = trend.bullets.slice(0, 3).map(b => `• ${b}`).join('\n');
  const text = `📡 Denis Capital Research — ${week.week} (${week.date})\n\n${trend.title} ${arrow.symbol}\n\n${topBullets}\n\n💡 ${trend.signal}\n\nhttps://dvb1974.github.io/trends-bubbles/`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.currentTarget;
    btn.classList.add('copied');
    btn.textContent = '✓ GEKOPIEERD';
    showToast('SIGNAAL GEKOPIEERD');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '⬡ DEEL DIT SIGNAAL'; }, 2500);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── SEARCH ─────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  searchQuery = this.value.trim().toLowerCase();
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  applySearch();
});

function clearSearch() {
  document.getElementById('search').value = '';
  document.getElementById('search-clear').style.display = 'none';
  searchQuery = '';
  applySearch();
}

function applySearch() {
  if (!searchQuery) {
    d3.selectAll('.bubble-group').classed('search-dim', false).classed('search-match', false);
    return;
  }
  d3.selectAll('.bubble-group').each(function(d) {
    const text = [d.title, d.subtitle, d.label, d.sublabel, ...(d.bullets||[]), d.signal].join(' ').toLowerCase();
    const match = text.includes(searchQuery);
    d3.select(this).classed('search-dim', !match).classed('search-match', match);
  });
}

// ── D3 CHART ───────────────────────────────────────────────────────────────────
const svg = d3.select('#chart');
let W = window.innerWidth;
let H = window.innerHeight;
svg.attr('width', W).attr('height', H);

let simulation, nodesSelection;

function rebuildChart() {
  svg.selectAll('*').remove();
  const trends = getTrends();

  const maxSize = Math.min(W, H) * 0.14;
  const sizeScale = d3.scaleLinear()
    .domain([d3.min(trends, d => d.size), d3.max(trends, d => d.size)])
    .range([maxSize * 0.55, maxSize]);

  const data = trends.map(d => ({ ...d, r: sizeScale(d.size) }));

  const defs = svg.append('defs');

  data.forEach(d => {
    const g = defs.append('radialGradient')
      .attr('id', `grad-${d.id}`)
      .attr('cx', '35%').attr('cy', '35%').attr('r', '65%');
    g.append('stop').attr('offset', '0%').attr('stop-color', d.glow).attr('stop-opacity', 0.9);
    g.append('stop').attr('offset', '60%').attr('stop-color', d.color).attr('stop-opacity', 0.55);
    g.append('stop').attr('offset', '100%').attr('stop-color', d.color).attr('stop-opacity', 0.15);

    const f = defs.append('filter').attr('id', `glow-${d.id}`).attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
    f.append('feGaussianBlur').attr('in', 'SourceGraphic').attr('stdDeviation', '6').attr('result', 'blur');
    const merge = f.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');
  });

  if (simulation) simulation.stop();

  simulation = d3.forceSimulation(data)
    .force('center', d3.forceCenter(W / 2, H / 2).strength(0.08))
    .force('charge', d3.forceManyBody().strength(d => -d.r * 2.5))
    .force('collision', d3.forceCollide(d => d.r + 8).strength(0.85))
    .force('x', d3.forceX(W / 2).strength(0.04))
    .force('y', d3.forceY(H / 2).strength(0.06))
    .alphaDecay(0.02)
    .velocityDecay(0.35);

  nodesSelection = svg.selectAll('.bubble-group')
    .data(data)
    .enter()
    .append('g')
    .attr('class', 'bubble-group')
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.15).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on('click', (event, d) => { event.stopPropagation(); openPanel(d); });

  // Glow ring
  nodesSelection.append('circle')
    .attr('class', 'bubble-glow')
    .attr('r', d => d.r + 12)
    .attr('fill', 'none')
    .attr('stroke', d => d.color)
    .attr('stroke-width', 1)
    .attr('opacity', 0.15)
    .attr('filter', d => `url(#glow-${d.id})`);

  // Main circle
  nodesSelection.append('circle')
    .attr('class', 'bubble-circle')
    .attr('r', d => d.r)
    .attr('fill', d => `url(#grad-${d.id})`)
    .attr('stroke', d => d.color)
    .attr('stroke-width', 1.5)
    .attr('stroke-opacity', 0.6)
    .attr('filter', d => `url(#glow-${d.id})`);

  // Inner ring
  nodesSelection.append('circle')
    .attr('r', d => d.r * 0.85)
    .attr('fill', 'none')
    .attr('stroke', d => d.color)
    .attr('stroke-width', 0.5)
    .attr('stroke-opacity', 0.25)
    .attr('stroke-dasharray', '3,4');

  // Trend arrow indicator (top-right of bubble)
  nodesSelection.filter(d => d.prevSize !== null)
    .append('text')
    .attr('text-anchor', 'middle')
    .attr('dx', d => d.r * 0.62)
    .attr('dy', d => -d.r * 0.62)
    .attr('font-size', d => Math.max(9, d.r * 0.16))
    .attr('fill', d => {
      const diff = d.size - d.prevSize;
      return diff > 5 ? '#00ff64' : diff < -5 ? '#ff3c5a' : '#C9A84C';
    })
    .attr('pointer-events', 'none')
    .attr('font-weight', 900)
    .text(d => {
      const diff = d.size - d.prevSize;
      return diff > 5 ? '▲' : diff < -5 ? '▼' : '◆';
    });

  // Label
  nodesSelection.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.r > 70 ? '-6px' : '-3px')
    .attr('font-family', 'Inter, sans-serif')
    .attr('font-weight', 900)
    .attr('font-size', d => Math.max(11, d.r * 0.22))
    .attr('fill', '#e8f0eb')
    .attr('pointer-events', 'none')
    .text(d => d.label);

  // Sublabel
  nodesSelection.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.r > 70 ? '12px' : '10px')
    .attr('font-family', "'Share Tech Mono', monospace")
    .attr('font-size', d => Math.max(8, d.r * 0.13))
    .attr('fill', d => d.color)
    .attr('opacity', 0.85)
    .attr('pointer-events', 'none')
    .text(d => d.sublabel);

  // Size dots
  nodesSelection.filter(d => d.r > 65)
    .append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.r * 0.65)
    .attr('font-family', "'Share Tech Mono', monospace")
    .attr('font-size', d => Math.max(7, d.r * 0.1))
    .attr('fill', d => d.color)
    .attr('opacity', 0.5)
    .attr('pointer-events', 'none')
    .text(d => '● '.repeat(Math.round(d.size / 25)).trim());

  simulation.on('tick', () => {
    nodesSelection.attr('transform', d => {
      d.x = Math.max(d.r + 10, Math.min(W - d.r - 10, d.x));
      d.y = Math.max(d.r + 60, Math.min(H - d.r - 50, d.y));
      return `translate(${d.x},${d.y})`;
    });
  });

  // reapply search if active
  if (searchQuery) applySearch();

  // Pulse animation
  function pulseGlow() {
    svg.selectAll('.bubble-glow')
      .transition().duration(2000 + Math.random() * 1000)
      .attr('opacity', 0.08 + Math.random() * 0.12)
      .attr('r', function(d) { return d.r + 8 + Math.random() * 8; })
      .transition().duration(2000 + Math.random() * 1000)
      .attr('opacity', 0.12)
      .attr('r', d => d.r + 12)
      .on('end', pulseGlow);
  }
  setTimeout(pulseGlow, 800);
}

svg.on('click', closePanel);

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  svg.attr('width', W).attr('height', H);
  rebuildChart();
});

// Init
buildWeekTabs();
rebuildChart();
</script>
</body>
</html>
